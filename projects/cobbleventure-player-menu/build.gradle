plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
}

apply from: rootProject.file('../../gradle/cobblemon-target.gradle')

version = mod_version
apply from: rootProject.file('../../gradle/artifact-version.gradle')
group = mod_group_id

base {
    archivesName = 'cobbleventure-player-menu'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

dependencies {
    compileOnly cobblemonBuildDependency
    compileOnly "curse.maven:cobbledollars-859232:8484919"
    compileOnly "curse.maven:cobblenav-976014:${cobblemonTarget == '1.8' ? '8823427' : '7940651'}"
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.2.20"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.mojang:brigadier:1.3.10'
    testRuntimeOnly 'com.google.code.gson:gson:2.10.1'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server { server() }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

processResources {
    def properties = [
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: artifactJarVersion,
        artifact_version_range: artifactVersionRange,
        cobblemon_version: cobblemonEffectiveVersion,
        cobblemon_version_range: cobblemonVersionRange,
        cobblenav_version_range: cobblemonTarget == '1.8' ? '[2.4.0,2.5)' : '[2.3.3,2.4)',
    ]
    inputs.properties properties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand properties
    }
}

tasks.register('cleanInstalledDevelopmentJars', Delete) {
    delete fileTree(cobbleventureDevelopmentModsDir) {
        include 'cobbleventure-player-menu-*.jar'
    }
}

tasks.register('installDevelopmentJar', Copy) {
    dependsOn jar
    dependsOn 'cleanInstalledDevelopmentJars'
    from jar
    into cobbleventureDevelopmentModsDir
}

tasks.named('build') {
    finalizedBy 'installDevelopmentJar'
}

apply from: rootProject.file('../../gradle/external-content.gradle')

dependencies {
    implementation 'dev.buizz.cobbleventure:cobbleventure-content-runtime:1.0.0'
}
