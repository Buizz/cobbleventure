plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
}

apply from: rootProject.file('../../gradle/cobblemon-target.gradle')

version = mod_version
group = mod_group_id

base {
    archivesName = 'cobbleventure-adventure'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

dependencies {
    compileOnly "dev.buizz.cobbleventure:cobbleventure-player-menu:1.6.0"
    compileOnly cobblemonBuildDependency
    compileOnly "maven.modrinth:ItmVb4zY:${cobbreeding_modrinth_version}"
    compileOnly "curse.maven:cobbledollars-859232:8484919"
    compileOnly "curse.maven:radical-cobblemon-trainers-api-1152792:7952419"
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.2.20"

    testImplementation platform('org.junit:junit-bom:5.10.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation "dev.buizz.cobbleventure:cobbleventure-player-menu:1.6.0"
    // Exercise the actual request DTO and packet codec at the Showdown/Minecraft boundary.
    testImplementation cobblemonBuildDependency
    testImplementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.2.20"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
    cobbreedingDistribution {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

dependencies {
    localRuntime "dev.buizz.cobbleventure:cobbleventure-battle-ai:0.1.0"
    cobbreedingDistribution "maven.modrinth:ItmVb4zY:${cobbreeding_modrinth_version}"
}

if (project.hasProperty('integration_mods_dir')) {
    def integrationModsDirectory = file(project.property('integration_mods_dir'))
    dependencies {
        localRuntime fileTree(integrationModsDirectory) {
            include '*.jar'
            exclude 'cobbleventure-adventure-*.jar'
            exclude 'cobbleventure-world-bootstrap-*.jar'
        }
    }
}

neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server { server() }
        gameTestServer { type = 'gameTestServer' }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
    addModdingDependenciesTo sourceSets.test
}

processResources {
    def properties = [
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version,
        cobblemon_version: cobblemonEffectiveVersion,
        cobblemon_version_range: cobblemonVersionRange,
        cobbreeding_version: cobbreeding_version,
        player_menu_version_range: player_menu_version_range,
    ]
    inputs.properties properties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand properties
    }
}

tasks.register('cleanInstalledDevelopmentJars', Delete) {
    delete fileTree(cobbleventureDevelopmentModsDir) {
        include 'cobbleventure-adventure-*.jar'
    }
}

tasks.register('syncCobbreedingDevelopmentJar') {
    def destination = new File(
        cobbleventureDevelopmentModsDir,
        'Cobbreeding-neoforge-2.2.2.jar'
    )
    inputs.files(configurations.cobbreedingDistribution)
    outputs.file(destination)
    doLast {
        def source = inputs.files.singleFile
        def digest = java.security.MessageDigest.getInstance('SHA-512')
        source.withInputStream { stream ->
            byte[] buffer = new byte[8192]
            for (int read = stream.read(buffer); read >= 0; read = stream.read(buffer)) {
                if (read > 0) digest.update(buffer, 0, read)
            }
        }
        def actual = digest.digest().collect { String.format('%02x', it & 0xff) }.join()
        def expected = '4af4f23a294b641a1f4129c96e38dde048ef760108713d5b5a73ac61817bac20b5c39a03d340a42f1a5dc4beb92d7ec40d3e10b9e556ac744c835865ce96a7ca'
        if (actual != expected) {
            throw new GradleException("Cobbreeding 2.2.2 SHA-512 불일치: ${actual}")
        }
        destination.parentFile.mkdirs()
        java.nio.file.Files.copy(
            source.toPath(), destination.toPath(),
            java.nio.file.StandardCopyOption.REPLACE_EXISTING
        )
    }
}

tasks.register('installDevelopmentJar') {
    dependsOn jar
    def destinationDirectoryPath = cobbleventureDevelopmentModsDir.absolutePath
    inputs.file(tasks.named('jar').flatMap { it.archiveFile })
    doLast {
        def destinationDirectory = new File(destinationDirectoryPath)
        def source = inputs.files.singleFile.toPath()
        def destination = destinationDirectory.toPath().resolve(source.fileName)
        def temporary = destinationDirectory.toPath().resolve(
            ".${source.fileName}.tmp-${ProcessHandle.current().pid()}"
        )
        java.nio.file.Files.createDirectories(destinationDirectory.toPath())
        try {
            java.nio.file.Files.copy(
                source, temporary, java.nio.file.StandardCopyOption.REPLACE_EXISTING
            )
            java.nio.file.Files.move(
                temporary,
                destination,
                java.nio.file.StandardCopyOption.ATOMIC_MOVE,
                java.nio.file.StandardCopyOption.REPLACE_EXISTING
            )
        } catch (java.nio.file.AccessDeniedException error) {
            throw new GradleException(
                '개발 모드 JAR가 사용 중입니다. Minecraft를 완전히 종료한 뒤 다시 빌드하세요.',
                error
            )
        } finally {
            java.nio.file.Files.deleteIfExists(temporary)
        }
        destinationDirectory.listFiles(
            { file -> file.name.startsWith('cobbleventure-adventure-')
                && file.name.endsWith('.jar')
                && file.toPath() != destination } as FileFilter
        )?.each { java.nio.file.Files.deleteIfExists(it.toPath()) }
    }
}

tasks.named('build') {
    finalizedBy 'installDevelopmentJar'
}

apply from: rootProject.file('../../gradle/external-content.gradle')

dependencies {
    implementation 'dev.buizz.cobbleventure:cobbleventure-content-runtime:1.0.0'
}
