plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
}

apply from: rootProject.file('../../gradle/cobblemon-target.gradle')

version = mod_version
group = mod_group_id

base {
    archivesName = 'cobbleventure-world-bootstrap'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

dependencies {
    compileOnly "dev.buizz.cobbleventure:cobbleventure-adventure:0.1.0"
    compileOnly "dev.buizz.cobbleventure:cobbleventure-player-menu:1.6.0"
    compileOnly cobblemonBuildDependency
    compileOnly "curse.maven:radical-cobblemon-trainers-api-1152792:7952419"
    compileOnly "curse.maven:cobbledollars-859232:8484919"
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.2.20"

    testImplementation platform('org.junit:junit-bom:5.10.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation "dev.buizz.cobbleventure:cobbleventure-adventure:0.1.0"
    testImplementation "dev.buizz.cobbleventure:cobbleventure-player-menu:1.6.0"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}


configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    localRuntime "dev.buizz.cobbleventure:cobbleventure-adventure:0.1.0"
    localRuntime "dev.buizz.cobbleventure:cobbleventure-player-menu:1.6.0"
    localRuntime fileTree('../cobbleventure-theme-blocks/build/libs') {
        include 'cobbleventure-theme-blocks-*.jar'
    }
    localRuntime cobblemonBuildDependency
    localRuntime "curse.maven:cobbledollars-859232:8484919"
    localRuntime "curse.maven:kotlin-for-forge-351264:8335665"
    localRuntime "maven.modrinth:caxton:0.6.4+1.21.1-NEOFORGE"
    localRuntime "maven.modrinth:4I1XuqiY:PAYgk63v"
    localRuntime "maven.modrinth:BVzZfTc1:YEMROAHv"
    localRuntime "maven.modrinth:YsFycamt:xf3H2eJV"
}

def integrationInstanceDirectory = null
if (project.hasProperty('integration_mods_dir')) {
    def integrationModsDirectory = file(project.property('integration_mods_dir'))
    integrationInstanceDirectory = integrationModsDirectory.parentFile
    dependencies {
        localRuntime fileTree(integrationModsDirectory) {
            include '*.jar'
            exclude 'cobbleventure-adventure-*.jar'
            exclude 'cobbleventure-player-menu-*.jar'
            exclude 'cobbleventure-world-bootstrap-*.jar'
        }
    }
}

neoForge {
    version = project.neo_version
    runs {
        configureEach {
            jvmArgument '-Xms2G'
            jvmArgument '-Xmx8G'
        }
        client { client() }
        server { server() }
        integrationServer {
            server()
            systemProperty 'cobbleventure.testStarterTown', 'true'
        }
        hexWorldServer {
            server()
            systemProperty 'cobbleventure.testHexWorld', 'true'
        }
        worldPerformanceServer {
            server()
            systemProperty 'cobbleventure.testHexWorld', 'true'
            systemProperty 'cobbleventure.performanceTest', 'true'
            // Render a representative starter-region crop so terrain changes can
            // be exercised repeatedly without rebuilding the entire Kanto map.
            systemProperty 'cobbleventure.testRenderRadius', '192'
        }
        townSequencePerformanceServer {
            server()
            systemProperty 'cobbleventure.townSequencePerformanceTest', 'true'
        }
        gameTestServer { type = 'gameTestServer' }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
    addModdingDependenciesTo sourceSets.test
}

tasks.register('syncDevelopmentEasyNpcSkins', Copy) {
    group = 'cobbleventure development'
    description = 'Copies generated EasyNPC skins into the local Minecraft run directory.'
    from(rootProject.file('../../pack/overrides/development-placeholder/config/easy_npc/skin')) {
        include '**/*.png'
    }
    into(file('run/config/easy_npc/skin'))
}

tasks.register('syncDevelopmentClientConfig', Copy) {
    group = 'cobbleventure development'
    description = 'Copies tracked client configuration into the local Minecraft run directory.'
    from(rootProject.file('../../pack/overrides/development-placeholder/config')) {
        include 'iris.properties'
        include 'neoforge-client.toml'
        include 'resourcepackoverrides.json'
    }
    into(file('run/config'))
}

tasks.register('cleanDevelopmentFontResourcePacks', Delete) {
    group = 'cobbleventure development'
    description = 'Removes obsolete Pokemon BW font experiments from the Paxi directory.'
    delete layout.projectDirectory.file('run/config/paxi/resourcepacks/PokemonBW.zip')
    delete layout.projectDirectory.file('run/config/paxi/resourcepacks/PokemonBW-Minecraft.zip')
    delete layout.projectDirectory.file('run/config/paxi/resourcepacks/Cobbleventure-Pokemon-Paintings.zip')
    delete layout.projectDirectory.file('run/config/paxi/resourcepacks/Cobbleventure-Music.zip')
    delete layout.projectDirectory.file('run/config/paxi/datapacks/zzz-cobbleventure-spawns.zip')
}

tasks.register('syncDevelopmentResourcePacks', Copy) {
    dependsOn 'cleanDevelopmentFontResourcePacks'
    group = 'cobbleventure development'
    description = 'Copies the Cobbleventure resource packs into the run directory.'
    from(rootProject.file('../../local-assets/PokemonBW-Caxton.zip'))
    into(file('run/config/paxi/resourcepacks'))
}

def runClientPreparationTasks = [
    'syncDevelopmentEasyNpcSkins',
    'syncDevelopmentClientConfig',
    'syncDevelopmentResourcePacks',
]
if (integrationInstanceDirectory != null) {
    tasks.register('syncIntegrationResourcePacks', Copy) {
        group = 'cobbleventure development'
        description = 'Copies launcher-downloaded resource packs into the local Minecraft run directory.'
        from(new File(integrationInstanceDirectory, 'resourcepacks')) {
            include 'Melodys Cute Villagers v1.11.1_pre-26.1.zip'
        }
        into(file('run/resourcepacks'))
    }
    runClientPreparationTasks.add('syncIntegrationResourcePacks')

    tasks.register('syncIntegrationShaderPacks', Copy) {
        group = 'cobbleventure development'
        description = 'Copies integration-instance shader packs into the local Minecraft run directory.'
        from(new File(integrationInstanceDirectory, 'shaderpacks')) {
            include 'ComplementaryReimagined_r5.3.zip'
        }
        into(file('run/shaderpacks'))
    }
    runClientPreparationTasks.add('syncIntegrationShaderPacks')
}

tasks.named('runClient') {
    dependsOn runClientPreparationTasks
}

tasks.named('runWorldPerformanceServer') {
    notCompatibleWithConfigurationCache('Updates the dedicated server watchdog setting')
    doFirst {
        def serverProperties = file('run/server.properties')
        if (serverProperties.isFile()) {
            def contents = serverProperties.getText('UTF-8')
            if (contents =~ /(?m)^max-tick-time=/) {
                contents = contents.replaceFirst(
                    /(?m)^max-tick-time=.*$/, 'max-tick-time=-1'
                )
            } else {
                contents += System.lineSeparator() + 'max-tick-time=-1' + System.lineSeparator()
            }
            serverProperties.setText(contents, 'UTF-8')
        }
    }
}

processResources {
    def properties = [
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version,
        cobblemon_version: cobblemonEffectiveVersion,
        cobblemon_version_range: cobblemonVersionRange,
    ]
    inputs.properties properties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand properties
    }
}

tasks.register('cleanInstalledDevelopmentJars', Delete) {
    delete fileTree(cobbleventureDevelopmentModsDir) {
        include 'cobbleventure-world-bootstrap-*.jar'
    }
}

tasks.register('installDevelopmentJar') {
    dependsOn jar
    def destinationDirectoryPath = cobbleventureDevelopmentModsDir.absolutePath
    inputs.file(tasks.named('jar').flatMap { it.archiveFile })
    doLast {
        def destinationDirectory = new File(destinationDirectoryPath)
        def source = inputs.files.singleFile.toPath()
        def destination = destinationDirectory.toPath().resolve(source.fileName)
        def temporary = destinationDirectory.toPath().resolve(
            ".${source.fileName}.tmp-${ProcessHandle.current().pid()}"
        )
        java.nio.file.Files.createDirectories(destinationDirectory.toPath())
        try {
            java.nio.file.Files.copy(
                source,
                temporary,
                java.nio.file.StandardCopyOption.REPLACE_EXISTING
            )
            java.nio.file.Files.move(
                temporary,
                destination,
                java.nio.file.StandardCopyOption.ATOMIC_MOVE,
                java.nio.file.StandardCopyOption.REPLACE_EXISTING
            )
        } catch (java.nio.file.AccessDeniedException error) {
            throw new GradleException(
                '개발 모드 JAR가 사용 중입니다. Minecraft를 완전히 종료한 뒤 다시 빌드하세요.',
                error
            )
        } finally {
            java.nio.file.Files.deleteIfExists(temporary)
        }
        destinationDirectory.listFiles(
            { file -> file.name.startsWith('cobbleventure-world-bootstrap-')
                && file.name.endsWith('.jar')
                && file.toPath() != destination } as FileFilter
        )?.each { java.nio.file.Files.deleteIfExists(it.toPath()) }
    }
}

tasks.named('build') {
    finalizedBy 'installDevelopmentJar'
}

apply from: rootProject.file('../../gradle/external-content.gradle')

dependencies {
    implementation 'dev.buizz.cobbleventure:cobbleventure-content-runtime:1.0.0'
}
