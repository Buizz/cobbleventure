plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
}

version = mod_version
group = mod_group_id

apply from: rootProject.file('../../gradle/cobblemon-target.gradle')

base {
    archivesName = 'cobbleventure-theme-blocks'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
}

neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server { server() }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

processResources {
    def properties = [
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version,
    ]
    inputs.properties properties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand properties
    }

}

tasks.register('cleanInstalledThemeBlockJars', Delete) {
    [
        cobbleventureDevelopmentModsDir,
        rootProject.file('../../pack/overrides/structure-builder/mods'),
        rootProject.file('../../pack/overrides/live-nbt-editor/mods'),
    ].each { directory ->
        delete fileTree(directory) {
            include 'cobbleventure-theme-blocks-*.jar'
        }
    }
}

tasks.register('installDevelopmentPackJar', Copy) {
    dependsOn jar
    dependsOn 'cleanInstalledThemeBlockJars'
    from jar
    into cobbleventureDevelopmentModsDir
}

tasks.register('installStructureBuilderJar', Copy) {
    dependsOn jar
    dependsOn 'cleanInstalledThemeBlockJars'
    from jar
    into rootProject.file('../../pack/overrides/structure-builder/mods')
}

tasks.register('installLiveEditorJar', Copy) {
    dependsOn jar
    dependsOn 'cleanInstalledThemeBlockJars'
    from jar
    into rootProject.file('../../pack/overrides/live-nbt-editor/mods')
}

tasks.register('installThemeBlockJars') {
    dependsOn 'installDevelopmentPackJar'
    dependsOn 'installStructureBuilderJar'
    dependsOn 'installLiveEditorJar'
}

tasks.named('build') {
    finalizedBy 'installThemeBlockJars'
}

dependencies {
    implementation 'dev.buizz.cobbleventure:cobbleventure-content-runtime:1.0.0'
}
apply from: rootProject.file('../../gradle/external-content.gradle')
