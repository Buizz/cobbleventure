plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
}

apply from: rootProject.file('../../gradle/cobblemon-target.gradle')

version = mod_version
group = mod_group_id
base { archivesName = 'cobbleventure-experience' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly files('../cobbleventure-player-menu/build/libs/cobbleventure-player-menu-1.6.0.jar')
    compileOnly cobblemonBuildDependency
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.2.20"
    localRuntime files('../cobbleventure-player-menu/build/libs/cobbleventure-player-menu-1.6.0.jar')
    localRuntime cobblemonBuildDependency
    localRuntime "maven.modrinth:kotlin-for-forge:5.10.0"
    localRuntime "curse.maven:cobbledollars-859232:8484919"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach { useJUnitPlatform() }

neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server { server() }
    }
    mods { "${mod_id}" { sourceSet(sourceSets.main) } }
    addModdingDependenciesTo sourceSets.test
}

processResources {
    def properties = [
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version,
        cobblemon_version_range: cobblemonVersionRange,
    ]
    inputs.properties properties
    filesMatching('META-INF/neoforge.mods.toml') { expand properties }
}

tasks.register('cleanInstalledDevelopmentJars', Delete) {
    delete fileTree(cobbleventureDevelopmentModsDir) {
        include 'cobbleventure-experience-*.jar'
    }
}

tasks.register('installDevelopmentJar', Copy) {
    dependsOn jar
    dependsOn 'cleanInstalledDevelopmentJars'
    from jar
    into cobbleventureDevelopmentModsDir
}

tasks.named('build') { finalizedBy 'installDevelopmentJar' }

dependencies {
    implementation 'dev.buizz.cobbleventure:cobbleventure-content-runtime:1.0.0'
}
apply from: rootProject.file('../../gradle/external-content.gradle')
