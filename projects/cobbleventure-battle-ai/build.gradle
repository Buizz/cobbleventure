plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'org.jetbrains.kotlin.multiplatform' version '2.2.20' apply false
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.2.20' apply false
}

apply from: rootProject.file('../../gradle/cobblemon-target.gradle')

allprojects {
    group = 'dev.buizz.cobbleventure'
    version = '0.1.0-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    if (name != 'shared-ai-core') {
        apply plugin: 'java-library'
    }

    plugins.withId('java-library') {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(21)
            }
            withSourcesJar()
        }

        tasks.withType(JavaCompile).configureEach {
            options.release = 21
            options.encoding = 'UTF-8'
        }

        dependencies {
            testImplementation platform('org.junit:junit-bom:5.10.3')
            testImplementation 'org.junit.jupiter:junit-jupiter'
            testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        }

        test {
            useJUnitPlatform()
        }
    }
}

version = mod_version
apply from: rootProject.file('../../gradle/artifact-version.gradle')
group = mod_group_id

base {
    archivesName = 'cobbleventure-battle-ai'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

dependencies {
    jarJar(implementation(project(':shared-ai-core')))
    compileOnly cobblemonBuildDependency
    compileOnly "curse.maven:radical-cobblemon-trainers-api-1152792:7952419"
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.2.20"

    testImplementation platform('org.junit:junit-bom:5.10.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

if (project.hasProperty('integration_mods_dir')) {
    def integrationModsDirectory = file(project.property('integration_mods_dir'))
    dependencies {
        localRuntime fileTree(integrationModsDirectory) {
            include '*.jar'
            exclude 'cobbleventure-battle-ai-*.jar'
            exclude 'cobbleventure-adventure-*.jar'
            exclude 'cobbleventure-world-bootstrap-*.jar'
        }
    }
}

evaluationDependsOn(':shared-ai-core')
def sharedAiCoreProject = project(':shared-ai-core')
def sharedAiCoreJvmCompilation = sharedAiCoreProject.kotlin.targets.jvm.compilations.main
def sharedAiCoreModSourceSet = sourceSets.create('sharedAiCoreMod') {
    output.dir(
        [builtBy: sharedAiCoreProject.tasks.named('compileKotlinJvm')],
        sharedAiCoreJvmCompilation.output.classesDirs
    )
}

neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server { server() }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'cobbleventure.battleAiReport',
                layout.buildDirectory.file('reports/battle-ai/headless-eve.json').get().asFile.absolutePath
        }
    }
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sharedAiCoreModSourceSet)
        }
    }
    addModdingDependenciesTo sourceSets.test
}

def generatedGameTestResources = layout.buildDirectory.dir('generated/resources/gameTest')
def generatedHeadlessContent = layout.buildDirectory.dir('generated/headless-content')

tasks.register('generateEmptyGameTestStructure') {
    def structureFile = generatedGameTestResources.map {
        it.file("data/${mod_id}/structure/empty.nbt")
    }
    outputs.dir(generatedGameTestResources)
    doLast {
        def output = structureFile.get().asFile
        output.parentFile.mkdirs()
        output.withOutputStream { raw ->
            new java.util.zip.GZIPOutputStream(raw).withCloseable { gzip ->
                new DataOutputStream(gzip).withCloseable { nbt ->
                    nbt.writeByte(10) // root compound
                    nbt.writeUTF('')

                    nbt.writeByte(9) // size: [1, 1, 1]
                    nbt.writeUTF('size')
                    nbt.writeByte(3)
                    nbt.writeInt(3)
                    nbt.writeInt(1)
                    nbt.writeInt(1)
                    nbt.writeInt(1)

                    nbt.writeByte(9) // entities: []
                    nbt.writeUTF('entities')
                    nbt.writeByte(10)
                    nbt.writeInt(0)

                    nbt.writeByte(9) // blocks: []
                    nbt.writeUTF('blocks')
                    nbt.writeByte(10)
                    nbt.writeInt(0)

                    nbt.writeByte(9) // palette: [{Name: "minecraft:air"}]
                    nbt.writeUTF('palette')
                    nbt.writeByte(10)
                    nbt.writeInt(1)
                    nbt.writeByte(8)
                    nbt.writeUTF('Name')
                    nbt.writeUTF('minecraft:air')
                    nbt.writeByte(0)

                    nbt.writeByte(3)
                    nbt.writeUTF('DataVersion')
                    nbt.writeInt(3955)
                    nbt.writeByte(0)
                }
            }
        }
    }
}

tasks.register('prepareHeadlessBattleContent', Sync) {
    dependsOn 'generateEmptyGameTestStructure'
    from(rootProject.file('../../pack/overrides/development-placeholder/config/cobbleventure/content')) {
        include 'content-manifest.json'
        include 'pack.mcmeta'
        include 'data/cobbleventure/catalogs/battle-ai/**'
    }
    from(generatedGameTestResources)
    into(generatedHeadlessContent)
}

tasks.named('runGameTestServer') {
    dependsOn 'prepareHeadlessBattleContent'
}

processResources {
    def properties = [
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: artifactJarVersion,
        artifact_version_range: artifactVersionRange,
        cobblemon_version: cobblemonEffectiveVersion,
        cobblemon_version_range: cobblemonVersionRange,
    ]
    inputs.properties properties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand properties
    }

}

tasks.register('cleanInstalledDevelopmentJars', Delete) {
    delete fileTree(cobbleventureDevelopmentModsDir) {
        include 'cobbleventure-battle-ai-*.jar'
    }
}

tasks.register('installDevelopmentJar') {
    dependsOn jar
    def destinationDirectoryPath = cobbleventureDevelopmentModsDir.absolutePath
    inputs.file(tasks.named('jar').flatMap { it.archiveFile })
    doLast {
        def destinationDirectory = new File(destinationDirectoryPath)
        def source = inputs.files.singleFile.toPath()
        def destination = destinationDirectory.toPath().resolve(source.fileName)
        def temporary = destinationDirectory.toPath().resolve(
            ".${source.fileName}.tmp-${ProcessHandle.current().pid()}"
        )
        java.nio.file.Files.createDirectories(destinationDirectory.toPath())
        try {
            java.nio.file.Files.copy(
                source, temporary, java.nio.file.StandardCopyOption.REPLACE_EXISTING
            )
            java.nio.file.Files.move(
                temporary,
                destination,
                java.nio.file.StandardCopyOption.ATOMIC_MOVE,
                java.nio.file.StandardCopyOption.REPLACE_EXISTING
            )
        } catch (java.nio.file.AccessDeniedException error) {
            throw new GradleException(
                '개발 모드 JAR가 사용 중입니다. Minecraft를 완전히 종료한 뒤 다시 빌드하세요.',
                error
            )
        } finally {
            java.nio.file.Files.deleteIfExists(temporary)
        }
        destinationDirectory.listFiles(
            { file -> file.name.startsWith('cobbleventure-battle-ai-')
                && file.name.endsWith('.jar')
                && file.toPath() != destination } as FileFilter
        )?.each { java.nio.file.Files.deleteIfExists(it.toPath()) }
    }
}

tasks.named('build') {
    finalizedBy 'installDevelopmentJar'
}

dependencies { implementation 'dev.buizz.cobbleventure:cobbleventure-content-runtime:1.0.0' }
apply from: rootProject.file('../../gradle/external-content.gradle')

neoForge.runs.named('gameTestServer') {
    systemProperty 'cobbleventure.contentDirectory', generatedHeadlessContent.get().asFile.absolutePath
}
