def requestedTarget = providers.gradleProperty('cobblemon_target')
    .orElse(providers.environmentVariable('COBBLEVENTURE_COBBLEMON_TARGET'))
    .getOrElse('1.8')
    .trim()

def targetAliases = [
    '1.7': '1.7.3',
    '1.7.3': '1.7.3',
    'stable': '1.8',
    '1.8': '1.8',
    '1.8.0': '1.8',
    '1.8.1': '1.8',
    'snapshot': '1.8',
]
def normalizedTarget = targetAliases[requestedTarget.toLowerCase(Locale.ROOT)]
if (normalizedTarget == null) {
    throw new GradleException(
        "지원하지 않는 Cobblemon 빌드 대상입니다: ${requestedTarget} (지원: 1.7.3, 1.8)"
    )
}

def localJarValue = providers.gradleProperty('cobblemon_local_jar')
    .orElse(providers.environmentVariable('COBBLEVENTURE_COBBLEMON_JAR'))
    .orNull
def localJar = localJarValue == null || localJarValue.isBlank()
    ? null
    : file(localJarValue)

if (normalizedTarget == '1.8') {
    if (localJar == null) {
        for (directory in [
            rootProject.file('../../.tmp/cobblemon-1.8-release'),
            rootProject.file('../../.tmp/cobblemon-1.8-snapshot'),
        ]) {
            def matches = directory.isDirectory()
                ? directory.listFiles().findAll { it.isFile() && it.name ==~ /Cobblemon-neoforge-1\.8\.1\+.*\.jar/ }
                    .sort { left, right -> right.lastModified() <=> left.lastModified() }
                : []
            if (!matches.isEmpty()) {
                localJar = matches.first()
                break
            }
        }
    }
    if (localJar == null) {
        throw new GradleException(
            'Cobblemon 1.8.1 JAR을 .tmp/cobblemon-1.8-release에 두거나 '
                + '-Pcobblemon_local_jar 또는 COBBLEVENTURE_COBBLEMON_JAR를 지정하세요.'
        )
    }
    if (!localJar.isFile()) {
        throw new GradleException("Cobblemon 1.8.1 JAR을 찾을 수 없습니다: ${localJar}")
    }
}

ext.cobblemonTarget = normalizedTarget
ext.cobblemonEffectiveVersion = normalizedTarget == '1.8' ? '1.8.1' : '1.7.3'
ext.cobblemonVersionRange = normalizedTarget == '1.8'
    ? '[1.8.0,1.9)'
    : '[1.7.3,1.8)'
ext.cobblemonBuildDependency = normalizedTarget == '1.8'
    ? files(localJar)
    : "maven.modrinth:cobblemon:${cobblemon_maven_version}"
ext.cobbleventureDevelopmentProfileId = normalizedTarget == '1.8'
    ? 'development-1.8'
    : 'development-placeholder'
ext.cobbleventureDevelopmentModsDir = rootProject.file(
    "../../pack/overrides/${cobbleventureDevelopmentProfileId}/mods"
)

logger.lifecycle(
    "Cobblemon target: ${cobblemonTarget}"
        + (normalizedTarget == '1.8' ? " (${localJar.name})" : '')
)
